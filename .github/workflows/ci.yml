name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend – Build & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: document_hub_test
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d document_hub_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Prepare configuration
        working-directory: backend
        run: |
          if [ ! -f src/main/resources/application.yml ]; then
            cp src/main/resources/application-example.yml src/main/resources/application.yml
          fi
          chmod +x mvnw

      - name: Build & Test
        working-directory: backend
        env:
          PORT: 8080
          DB_URL: jdbc:postgresql://localhost:5433/document_hub_test
          DB_USER: test_user
          DB_PASSWORD: test_pass
          DB_DRIVER_CLASS: org.postgresql.Driver
          DDL_AUTO: create-drop
          SHOW_SQL: false
          FORMAT_SQL: false
          DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
          MONGO_URL: mongodb://localhost:27017/document_hub_test
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          MAX_FILE_SIZE: 10MB
          MAX_REQUEST_SIZE: 10MB
          BUCKET_NAME: test-bucket
          ACCESS_KEY: test-key
          SECRET_KEY: test-secret
          AWS_REGION: ap-southeast-2
          JWT_SIGNER_KEY: dGVzdF9rZXlfZm9yX2NpX29ubHlfbm90X2Zvcl9wcm9kdWN0aW9u
          FRONTEND_URL: http://localhost:5173
        run: ./mvnw verify -B

  frontend:
    name: Frontend – Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install & Build
        working-directory: frontend
        run: |
          npm install
          npm run build
