server:
  port: ${PORT}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER_CLASS}

  jpa:
    hibernate:
      ddl-auto: ${DDL_AUTO}
    show-sql: ${SHOW_SQL}
    properties:
      hibernate:
        format_sql : ${FORMAT_SQL}
    database-platform: ${DATABASE_PLATFORM}

  data:
    mongodb:
      uri: ${MONGO_URL}
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

aws:
  s3:
    bucket-name: ${BUCKET_NAME}
    access-key: ${ACCESS_KEY}
    secret-key: ${SECRET_KEY}
    region: ${AWS_REGION}