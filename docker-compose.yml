services:
  # 1. PostgreSQL
  postgres:
    image: postgres:16-alpine
    container_name: document-hub-postgres
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_v2:/var/lib/postgresql/data
    networks:
      - document_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      retries: 5
      start_period: 10s

  # 2. MongoDB
  mongodb:
    image: mongo:7.0
    container_name: document-hub-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - document_network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      retries: 5
      start_period: 10s

  # 3. Redis
  redis:
    image: redis:7-alpine
    container_name: document-hub-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    networks:
      - document_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5
      start_period: 5s

  # 4. Spring Boot backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: document-hub-backend
    restart: unless-stopped
    env_file: .env
    environment:
      DB_URL: jdbc:postgresql://document-hub-postgres:5432/${DB_NAME}
      MONGO_URL: mongodb://document-hub-mongodb:27017/document_hub_logs
      REDIS_HOST: document-hub-redis
      REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - document_network

  # 5. Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: document-hub-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    networks:
      - document_network

volumes:
  postgres_data_v2:
  mongodb_data:

networks:
  document_network:
    driver: bridge
